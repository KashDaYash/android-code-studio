name: Build Android Code Studio

on:
  push:
    branches:
      - "dev"
      - "main"
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build_release_apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Determine Build Type Configuration
        run: |
          SELECTED_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_TYPE="${SELECTED_TYPE:-Debug}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "Selected build type: $BUILD_TYPE"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure output directories exist
        run: |
          # create expected output directory and other needed dirs
          mkdir -p core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}
          mkdir -p core/app/build/intermediates || true

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble APK
        run: |
          echo "Running: ./gradlew assemble${{ env.BUILD_TYPE }} -x signApk --info"
          ./gradlew assemble${{ env.BUILD_TYPE }} -x signApk --info 2>&1 | tee build.log

      - name: Display Build Errors (tail)
        if: always()
        run: |
          echo "=== Last 300 lines of build.log ==="
          tail -n 300 build.log || echo "build.log not found"
          echo ""
          echo "=== Errors Found in build.log ==="
          grep -iE "error|failed|exception" build.log | tail -50 || echo "No error keywords found"

      - name: Find APKs and show details
        if: always()
        run: |
          echo "BUILD_TYPE_LOWER=${{ env.BUILD_TYPE_LOWER }}"
          echo "Listing core/app/build/outputs/apk tree (maxdepth 5):"
          if [ -d core/app/build/outputs/apk ]; then
            find core/app/build/outputs/apk -maxdepth 5 -type f -name "*.apk" -ls || echo "No APK files found under outputs/apk"
          else
            echo "Directory core/app/build/outputs/apk not found"
          fi

      - name: List APK files (legacy check)
        run: ls -la core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/ || echo "Directory not found"

      - name: Upload all APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ env.BUILD_TYPE_LOWER }}
          path: |
            core/app/build/outputs/apk/**/*.apk
            core/app/build/outputs/apk/*/*${{ env.BUILD_TYPE_LOWER }}*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_TYPE_LOWER }}
          path: build.log
