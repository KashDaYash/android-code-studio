name: Build Android Code Studio

on:
  push:
    branches:
      - "dev"
      - "main"
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build_release_apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.13.0
        with:
          access_token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Determine Build Type Configuration
        run: |
          SELECTED_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_TYPE="${SELECTED_TYPE:-Debug}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "Selected build type: $BUILD_TYPE"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v3-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # AGP/desugar expects these intermediate dirs to exist before mergeExtDex*
      - name: Create missing intermediate dirs
        run: |
          BASE="core/app/build/intermediates"
          mkdir -p \
            "$BASE/external_file_lib_dex_archives/debug/desugarDebugFileDependencies" \
            "$BASE/external_file_lib_dex_archives/release/desugarReleaseFileDependencies" \
            "$BASE/l8_art_profile/debug/l8DexDesugarLibDebug" \
            "$BASE/l8_art_profile/release/l8DexDesugarLibRelease" \
            "core/app/build/outputs/apk/debug" \
            "core/app/build/outputs/apk/release"

      - name: Assemble APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          echo "Running: ./gradlew assemble${BUILD_TYPE}"
          ./gradlew "assemble${BUILD_TYPE}" --stacktrace 2>&1 | tee build.log

      - name: Display Build Errors (tail)
        if: always()
        run: |
          echo "=== Last 200 lines of build.log ==="
          tail -n 200 build.log || echo "build.log not found"
          echo ""
          echo "=== Error keywords ==="
          grep -iE "error|failed|exception|FAILURE" build.log | tail -40 || echo "No error keywords found"

      - name: Find APKs
        if: always()
        id: find_apks
        run: |
          echo "Listing APK tree:"
          find core/app/build/outputs -type f -name "*.apk" -ls 2>/dev/null || true
          APK_COUNT=$(find core/app/build/outputs -type f -name "*.apk" 2>/dev/null | wc -l | tr -d ' ')
          echo "APK_COUNT=$APK_COUNT"
          echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
          if [ "$APK_COUNT" = "0" ]; then
            echo "::error::No APK files were produced. Build did not package the app."
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ env.BUILD_TYPE_LOWER }}
          path: core/app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_TYPE_LOWER }}
          path: build.log
          if-no-files-found: warn
